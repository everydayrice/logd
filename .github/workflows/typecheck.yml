name: Typecheck
on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run api:check
      - name: Verify Drizzle migrations are committed
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/neondb
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "Drizzle schema has uncommitted migrations."
            exit 1
          fi
