name: Typecheck
on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run api:check
      - name: Generate Drizzle migration (dry run)
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/neondb
        run: |
          npm run db:generate
          echo '===== LOGD GENERATED SQL BEGIN ====='
          find packages/db/drizzle -maxdepth 1 -name '*.sql' -exec cat {} \;
          echo '===== LOGD GENERATED SQL END ====='
          echo '===== LOGD MIGRATION JOURNAL BEGIN ====='
          cat packages/db/drizzle/meta/_journal.json
          echo '===== LOGD MIGRATION JOURNAL END ====='
          echo '===== LOGD MIGRATION SNAPSHOT BEGIN ====='
          cat packages/db/drizzle/meta/0000_snapshot.json
          echo '===== LOGD MIGRATION SNAPSHOT END ====='
