name: Expo web build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Export Expo web
        run: npm exec --workspace=@logd/app -- expo export --platform web
